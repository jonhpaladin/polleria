services:
  - type: web
    name: polleria-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_VERSION
        value: 0.1.0
      - key: APP_TIME_ZONE
        value: America/Mexico_City
